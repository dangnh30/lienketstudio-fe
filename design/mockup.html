<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lienket Studio – Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F2F3;--card:#fff;--ink:#1C1D20;--ink2:#3D4047;--muted:#5C6068;--line:#E2E3E6;--line2:#ECEDEF;--soft:#EEEFF1;
  --accent:#D9621F;--accent-ink:#A84A15;--accent-bg:#FCEBDF;--accent-row:#FEF6F0;--accent-soft:#F2C4A6;
  --warn:#9A3A0E;--warn-bg:#FBEBE2;--warn-row:#FDF5F0;--warn-line:#E8C8B4;--link:#1F5FBF;
  --shopee:#C2410C;--shopee-bg:#FDEEE6;--tiktok:#15171A;--tiktok-bg:#ECEDEF;--fb:#1F5FBF;--fb-bg:#E7EFFB;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
a{color:var(--link)}
input[type=checkbox],input[type=radio]{accent-color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:600}
b,strong,th{font-weight:600}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.modebar{position:sticky;top:0;z-index:30;background:#15171A;color:#fff;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 16px;font-size:13px}
.modebar a{color:#fff;text-decoration:none;padding:6px 12px;border-radius:2px;border:1px solid rgba(255,255,255,.25)}
.modebar a.on{background:#fff;color:#15171A;border-color:#fff;font-weight:500}
.modebar .sp{flex:1}
.modebar button{background:none;border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:2px;padding:6px 12px;cursor:pointer}
.app{display:flex;flex-wrap:wrap;min-height:calc(100vh - 44px)}
.side{flex:1 1 220px;max-width:248px;background:#fff;border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:16px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-weight:600;font-size:17px}
.logo i{width:32px;height:32px;border-radius:4px;background:var(--accent);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.side nav{display:flex;flex-direction:column;gap:3px}
.side nav a{display:flex;align-items:center;justify-content:space-between;min-height:40px;padding:0 12px;border-radius:4px;color:var(--ink2);text-decoration:none;font-size:14px}
.side nav a.on{background:var(--accent-bg);color:var(--accent-ink);font-weight:500}
.side{background:#26282D;border-right:none}
.side .logo{color:#fff}
.side nav a{color:#C9CBD1}
.side nav a:hover{background:rgba(255,255,255,.06)}
.side nav a.on{background:rgba(255,255,255,.1);color:#fff;box-shadow:inset 3px 0 0 var(--accent);border-radius:0 4px 4px 0}
.side .btn{background:transparent;color:#E6E7EA;border-color:rgba(255,255,255,.25)}
.cnt{min-width:22px;height:20px;padding:0 6px;border-radius:2px;background:var(--warn-bg);color:var(--warn);font-size:12px;font-weight:500;display:inline-flex;align-items:center;justify-content:center}
.main{flex:999 1 560px;min-width:0;padding:22px 28px 48px;display:flex;flex-direction:column;gap:18px}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px}
.head h1{font-size:24px}
.sub{font-size:14px;color:var(--muted);margin-top:4px}
.card{background:#fff;border:1px solid var(--line);border-radius:6px}
.pad{padding:18px 20px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.between{justify-content:space-between}
.muted{color:var(--muted)}.small{font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:4px;border:1px solid #D5D8D4;background:#fff;font-weight:500;font-size:14px;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:4px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{min-height:38px;padding:0 14px;border-radius:2px;border:1px solid #D5D8D4;background:#fff;color:var(--ink2);cursor:pointer;font-size:13.5px}
.chip.on{border-color:var(--accent);background:var(--accent-bg);color:var(--accent-ink);font-weight:500}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:2px;font-size:12px;font-weight:500;background:var(--soft);color:var(--ink2);white-space:nowrap}
.badge.ok{background:var(--accent-bg);color:var(--accent-ink)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.badge.sp{background:#EE4D2D;color:#fff}
.badge.tt{background:var(--tiktok-bg);color:var(--tiktok)}
.badge.fb{background:var(--fb-bg);color:var(--fb)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:6px;padding:14px 16px}
.kpi b{display:block;font-size:26px}
.bar{height:6px;border-radius:2px;background:#ECEEEA;overflow:hidden}.bar i{display:block;height:6px;background:var(--accent)}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--muted);font-weight:500;font-size:12.5px;padding:10px 12px;border-bottom:1px solid var(--line)}
td{padding:11px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr.flag{background:var(--warn-row)}tr.dim{background:#FAFBF9;color:var(--muted)}tr.best{background:var(--accent-row)}
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:500}
.stabs{display:flex;flex-wrap:wrap;gap:8px}
.meter{display:flex;flex-direction:column;gap:6px}
.meter .bar{height:8px}.meter .bar i{height:8px}
.kv{display:grid;grid-template-columns:minmax(150px,220px) 1fr auto;gap:10px 16px;align-items:center;font-size:14px}
.kv>div{min-width:0}
@media (max-width:640px){.kv{grid-template-columns:1fr}}
.danger{border-color:#F0C9C4}
.btn.dz{color:#B42318;border-color:#F0C9C4}
.banner{background:var(--warn-row);border:1px solid var(--warn-line);border-radius:6px;padding:12px 16px;font-size:14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
input[type=text],input[type=search],input[type=time],input[type=email],input[type=password],select,textarea{min-height:42px;padding:0 12px;border-radius:4px;border:1px solid #D5D8D4;background:#fff;font-size:14.5px;font-weight:400}
textarea{padding:10px 12px}
.err{color:#B42318;font-size:13px;font-weight:500;min-height:18px}
.ph{background:#EEF0EC;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;text-align:center}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#15171A;color:#fff;padding:12px 18px;border-radius:4px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;max-width:90vw}
.toast.show{opacity:1}
.todo{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line2)}
.todo:first-of-type{border-top:none}
.ic{width:36px;height:36px;border-radius:4px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;font-weight:600;font-size:13px}
.post{border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#fff}
.post .hd{display:flex;align-items:center;gap:10px;padding:10px 12px}
.post .av{width:36px;height:36px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center}
.post .tx{padding:0 12px 10px;font-size:14px;white-space:pre-line}
.dealimg{position:relative;height:200px;background:#EEF0EC;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px}
.dealimg .tag{position:absolute;left:12px;top:12px;background:var(--accent);color:#fff;font-weight:600;padding:4px 10px;border-radius:4px;font-size:13px}
.dealimg .pr{position:absolute;right:12px;bottom:12px;background:#fff;color:var(--ink);font-weight:600;padding:6px 12px;border-radius:4px;font-size:16px;box-shadow:0 1px 0 rgba(0,0,0,.08)}
.vid{width:150px;flex:0 0 auto;aspect-ratio:9/16;border-radius:6px;background:#15171A;color:#fff;display:flex;flex-direction:column;justify-content:space-between;padding:10px;font-size:12px}
.vid .p{background:#fff;color:#15171A;border-radius:3px;padding:4px 6px;font-weight:600;font-size:13px;align-self:flex-start}
.steps{margin:0;padding-left:18px;font-size:13.5px;color:var(--ink2)}
.steps li{margin:3px 0}
.notif{position:relative}
.panel{position:absolute;right:0;top:48px;width:340px;max-width:86vw;background:#fff;border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.08);z-index:40;padding:6px 0;display:none}
.panel.open{display:block}
.panel .it{padding:10px 14px;border-top:1px solid var(--line2);font-size:13.5px}
.panel .it:first-child{border-top:none}
.panel .it.unread{background:var(--accent-row)}
.site{max-width:1080px;margin:0 auto;padding:24px 20px 56px;display:flex;flex-direction:column;gap:20px}
.sitebar{background:#fff;border-bottom:1px solid var(--line)}
.sitebar .in{max-width:1080px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
code{background:var(--soft);padding:2px 6px;border-radius:2px;font-weight:600;font-size:.92em}
@media (max-width:720px){.main{padding:18px 16px 40px}.side{max-width:none;border-right:none;border-bottom:1px solid var(--line)}.panel{right:-60px}}

/* ================= Modern layer ================= */
:root{--bg:#F5F5F6;--line:#E8E8EB;--line2:#F0F0F2;--soft:#F2F2F4;--r:16px;
  --sh1:0 1px 2px rgba(16,18,24,.04),0 1px 3px rgba(16,18,24,.05);
  --sh2:0 4px 12px -2px rgba(16,18,24,.06),0 2px 4px -2px rgba(16,18,24,.04);
  --sh3:0 16px 40px -8px rgba(16,18,24,.18),0 4px 12px -4px rgba(16,18,24,.08)}
body{font-size:14.5px;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;letter-spacing:-.006em;font-feature-settings:"cv11","ss01"}
h1,h2,h3{letter-spacing:-.015em}
.modebar{padding:6px 16px;font-size:12.5px;background:#0E0F11;min-height:44px}
.modebar a,.modebar button{padding:4px 10px}
.app{display:flex;min-height:calc(100vh - 44px);flex-wrap:nowrap}
.side{flex:0 0 244px;max-width:244px;position:sticky;top:44px;height:calc(100vh - 44px);overflow-y:auto;padding:18px 12px 14px;gap:18px;background:#1E1F23}
.logo{font-size:15.5px;padding:2px 8px}
.logo i{width:34px;height:34px;border-radius:4px;background:linear-gradient(135deg,var(--accent) 0%,var(--accent-ink) 100%);box-shadow:0 4px 12px -2px color-mix(in srgb,var(--accent) 55%,transparent),inset 0 1px 0 rgba(255,255,255,.25)}
.logo span{display:flex;flex-direction:column;line-height:1.15}
.logo small{font-size:11.5px;font-weight:500;color:#8C8F98;letter-spacing:.02em}
.side nav{gap:2px}
.side nav .grp{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#6E727C;font-weight:500;padding:14px 10px 6px}
.side nav .grp:first-child{padding-top:2px}
.side nav a{min-height:38px;padding:0 10px;gap:11px;justify-content:flex-start;border-radius:4px;color:#B4B7BF;font-weight:500;transition:background .15s,color .15s}
.side nav a .lb{flex:1}
.side nav a .i{color:#80848E;transition:color .15s;flex:0 0 auto}
.side nav a:hover{background:rgba(255,255,255,.05);color:#fff}
.side nav a:hover .i{color:#C9CBD1}
.side nav a.on{background:rgba(255,255,255,.08);color:#fff;box-shadow:none;border-radius:4px;font-weight:500}
.side nav a.on .i{color:var(--accent)}
.side .cnt{background:rgba(255,255,255,.1);color:#E6E7EA;font-size:11.5px;height:19px;min-width:20px}
.side nav a.on .cnt{background:var(--accent);color:#fff}
.sidefoot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.sitelink{display:flex;align-items:center;gap:10px;padding:10px;border-radius:4px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);color:#D6D8DD;text-decoration:none;font-size:13px;font-weight:500}
.sitelink span{flex:1}.sitelink:hover{background:rgba(255,255,255,.08);color:#fff}
.me{display:flex;align-items:center;gap:10px;padding:8px 6px;border-top:1px solid rgba(255,255,255,.07);padding-top:12px}
.me b{display:block;color:#fff;font-size:13.5px}.me>div span{font-size:12px;color:#8C8F98}
.avatar{width:34px;height:34px;border-radius:50%;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent-ink));box-shadow:inset 0 0 0 2px rgba(255,255,255,.12)}
.avatar.sm{width:32px;height:32px}
.mainwrap{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:44px;z-index:20;display:flex;align-items:center;gap:12px;padding:10px 28px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(180%) blur(12px);-webkit-backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--line)}
.crumb{display:flex;gap:8px;align-items:center;font-size:13.5px;flex:1;min-width:0;white-space:nowrap}
.crumb .sep{color:#C4C6CC}
.search{position:relative;display:flex;align-items:center;gap:8px;width:300px;max-width:40vw;height:38px;padding:0 10px 0 12px;border-radius:4px;background:#fff;border:1px solid var(--line);box-shadow:var(--sh1);color:var(--muted);transition:border-color .15s,box-shadow .15s}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 16%,transparent)}
.search input{border:none!important;outline:none;background:transparent!important;flex:1;min-width:0;min-height:0!important;height:34px;padding:0!important;font-size:13.5px;box-shadow:none!important}
.search input::-webkit-search-cancel-button{display:none}
kbd{font:500 11px/1 'Inter',system-ui;border:1px solid var(--line);border-bottom-width:2px;border-radius:2px;padding:3px 6px;color:var(--muted);background:var(--soft)}
.qres{position:absolute;left:0;right:0;top:44px;background:#fff;border:1px solid var(--line);border-radius:6px;box-shadow:var(--sh3);padding:6px;display:none;z-index:45}
.qres.open{display:block;animation:pop .14s ease-out}
.qres a{display:flex;align-items:center;gap:10px;padding:8px;border-radius:4px;text-decoration:none;color:var(--ink);font-size:13.5px}
.qres a:hover{background:var(--soft)}
.iconbtn{position:relative;width:38px;height:38px;border-radius:4px;border:1px solid var(--line);background:#fff;box-shadow:var(--sh1);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink2);transition:background .15s}
.iconbtn:hover{background:var(--soft)}
.iconbtn .dot{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;padding:0 5px;border-radius:2px;background:var(--accent);color:#fff;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg)}
.panel{top:46px;width:360px;border-radius:6px;box-shadow:var(--sh3);padding:0;overflow:hidden}
.panel.open{animation:pop .14s ease-out}
.panel .phd{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line2)}
.panel .it{position:relative;padding:11px 14px 11px 28px;transition:background .12s}
.panel .it:hover{background:var(--soft)}
.panel .it.unread::before{content:"";position:absolute;left:12px;top:17px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.main{flex:1;padding:26px 28px 56px;gap:20px;max-width:1320px;width:100%}
.main>*{animation:rise .28s cubic-bezier(.2,.7,.2,1) both}
.main>*:nth-child(2){animation-delay:.03s}.main>*:nth-child(3){animation-delay:.06s}.main>*:nth-child(4){animation-delay:.09s}.main>*:nth-child(n+5){animation-delay:.12s}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(-4px) scale(.98)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.head h1{font-size:26px;font-weight:600}
.sub{font-size:13.5px}
.card{border-color:var(--line);border-radius:6px;box-shadow:var(--sh1)}
.pad{padding:20px 22px}
section.card h2{font-weight:600}
.btn{min-height:40px;border-radius:4px;border-color:var(--line);box-shadow:var(--sh1);font-weight:500;transition:background .15s,box-shadow .15s,transform .05s,filter .15s}
.btn:hover{background:#FAFAFB}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--accent);border-color:transparent;box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 1px 2px rgba(0,0,0,.08),0 4px 10px -4px color-mix(in srgb,var(--accent) 70%,transparent)}
.btn.pri:hover{background:var(--accent);filter:brightness(1.07)}
.btn.sm{min-height:34px;border-radius:4px}
.btn.dz:hover{background:#FEF3F2}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:inline-flex;flex-wrap:wrap;gap:2px;padding:4px;background:#E9E9EC;border-radius:6px;align-self:flex-start;max-width:100%}
.seg .chip{border:none;background:transparent;min-height:34px;padding:0 14px;border-radius:4px;color:var(--muted);font-weight:500;transition:background .15s,color .15s}
.seg .chip:hover{color:var(--ink)}
.seg .chip.on{background:#fff;color:var(--ink);font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.06),0 1px 3px rgba(0,0,0,.06)}
.seg .chip .cnt{background:var(--accent);color:#fff}
.kpis{gap:14px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.kpi{display:flex;flex-direction:column;gap:6px;border-radius:6px;padding:16px 18px;box-shadow:var(--sh1);text-decoration:none;color:var(--ink);transition:box-shadow .2s,transform .2s,border-color .2s}
a.kpi:hover{box-shadow:var(--sh2);transform:translateY(-1px);border-color:#DCDCE0}
.kpi .kh{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);font-weight:500}
.kpi .ki{width:30px;height:30px;border-radius:4px;display:flex;align-items:center;justify-content:center;background:var(--accent-bg);color:var(--accent-ink)}
.kpi .ki.warn{background:var(--warn-bg);color:var(--warn)}
.kpi b{font-size:30px;font-weight:600;letter-spacing:-.02em;line-height:1.15}
.kpi b small{font-size:14px;font-weight:500;color:var(--muted);letter-spacing:0}
.kpi .bar{margin-top:4px}
.delta{font-size:12.5px;color:var(--muted)}
.delta.up{color:#127A4B}.delta.up::before{content:"↑ "}
.bar{background:#EDEDF0;height:6px;border-radius:2px}.bar i{border-radius:2px}
.todo{padding:12px 10px;margin:0 -10px;border-radius:6px;border-top:none;text-decoration:none;color:var(--ink);transition:background .15s}
.todo:hover{background:var(--soft)}
.todo+.todo{position:relative}
.todo+.todo::before{content:"";position:absolute;left:58px;right:10px;top:0;border-top:1px solid var(--line2)}
.todo:hover::before,.todo:hover+.todo::before{opacity:0}
.ic{width:40px;height:40px;border-radius:6px}
.todo .go{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:500;color:var(--muted);transition:color .15s,gap .15s}
.todo:hover .go{color:var(--accent-ink);gap:7px}
.badge{border-radius:4px;padding:3px 8px;font-weight:500;font-size:11.5px;letter-spacing:.01em}
.badge.ok::before,.badge.warn::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.85}
.badge.sp{border-radius:4px}
.cnt{border-radius:2px}
.tbl{border-radius:6px}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;font-weight:500;color:#7A7E87;background:#FAFAFB;padding:11px 14px}
thead tr th:first-child{border-top-left-radius:var(--r)}thead tr th:last-child{border-top-right-radius:var(--r)}
td{padding:13px 14px}
tbody tr{transition:background .12s}

.cmp-box{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:6px;padding:6px 6px 6px 14px;color:var(--muted)}
.cmp-box:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 16%,transparent)}
.cmp-box input{flex:1;min-width:0;border:none!important;box-shadow:none!important;outline:none;background:transparent;padding:0!important;font-size:15px;color:var(--ink)}
.cmp-box.big{padding:8px 8px 8px 16px}.cmp-box.big input{font-size:16.5px;min-height:44px}
.cmp-q{display:flex;flex-direction:column;gap:8px}.cmp-q .err{min-height:0}.cmp-q .err:empty{display:none}
.cmp-targets{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.tgt{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:0 12px 0 8px;border:1px solid var(--line);border-radius:4px;background:#fff;font:inherit;font-size:13.5px;color:var(--ink2);cursor:pointer}
.tgt .ck{width:18px;height:18px;border-radius:2px;border:1px solid #C9CACF;display:inline-flex;align-items:center;justify-content:center;font-size:12px;color:#fff}
.tgt.on{border-color:var(--accent);color:var(--ink);background:var(--accent-row)}.tgt.on .ck{background:var(--accent);border-color:var(--accent)}
.cmp-how{list-style:none;margin:6px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden;counter-reset:s}
.cmp-how li{background:#fff;padding:12px 14px;display:flex;flex-direction:column;gap:2px;font-size:13.5px;counter-increment:s}
.cmp-how li b::before{content:counter(s) ". ";color:var(--accent)}
.cmp-how li span{color:var(--muted);font-size:13px}
.pick{display:flex;align-items:center;gap:12px;width:100%;padding:12px 20px;border:none;border-top:1px solid var(--line2);background:#fff;font:inherit;font-size:14px;color:var(--ink);cursor:pointer}
.pick:hover{background:#FAFAFA}
.src{display:flex;flex-wrap:wrap;gap:18px;align-items:center;padding:18px 20px}
.srcimg{width:120px;height:120px;flex:0 0 auto;border-radius:4px}
.srcinfo{flex:1 1 300px;min-width:0;display:flex;flex-direction:column;gap:6px}
.srcprice{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.srcprice b{font-size:24px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.verdict{display:flex;flex-direction:column;gap:2px;padding:14px 18px;border-radius:6px;background:var(--accent-row);border:1px solid var(--accent-soft);font-size:14px}
.verdict b{font-size:17px;font-weight:600}.verdict span{color:var(--ink2)}
.verdict.same{background:#F7F7F8;border-color:var(--line)}
.mrow{display:flex;align-items:center;gap:12px;padding:12px 20px;border-top:1px solid var(--line2);font-size:14px;flex-wrap:wrap}
.mprice{display:flex;flex-direction:column;align-items:flex-end;min-width:120px;font-size:13px}
.mprice b{font-size:15px}
.cheaper{color:#127A4B;font-weight:500}.dearer{color:var(--muted)}
.site-ic{width:32px;height:32px;border-radius:4px;background:var(--soft);color:var(--ink2);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;flex:0 0 auto}
@media (max-width:640px){.mrow{gap:8px 12px}.mrow>span:nth-child(2){flex:1 1 calc(100% - 50px)}.mrow>.badge{order:-1}.mrow>.badge+span{flex:1 1 100%!important}.mprice{flex-direction:row;gap:8px;align-items:baseline}.srcimg{width:72px;height:72px}.srcinfo{flex-basis:calc(100% - 90px)}.srcprice{flex-direction:row;flex-wrap:wrap;align-items:center;gap:4px 12px;width:100%}.srcprice .small{width:100%}.cmp-hero h1{font-size:24px}.mprice{align-items:flex-start;min-width:0}.mrow .btn{margin-left:auto}.cmp-box .btn{padding:0 12px}}

let RANGE=30;
const n0=v=>Math.round(v).toLocaleString('vi-VN');

function series(days,seed){let s=seed;const out=[];for(let i=0;i<days;i++){s=(s*9301+49297)%233280;const r=s/233280;const dow=(i+4)%7;const wk=dow===5||dow===6?1.25:1;const trend=0.8+0.4*i/Math.max(1,days-1);out.push({clicks:Math.round((90+r*90)*wk*trend),orders:0,comm:0});const o=out[i];o.orders=Math.max(1,Math.round(o.clicks*(0.028+r*0.02)));o.comm=o.orders*(14000+Math.round(r*9000))}return out}

function doLogin(){
  const em=document.getElementById('l_email'),pw=document.getElementById('l_pw');let ok=true;
  const ev=em.value.trim();document.getElementById('e_l_email').textContent='';document.getElementById('e_l_pw').textContent='';
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(ev)){document.getElementById('e_l_email').textContent='Email chưa đúng định dạng';ok=false}
  if(pw.value.length<8){document.getElementById('e_l_pw').textContent='Mật khẩu có ít nhất 8 ký tự';ok=false}
  if(!ok)return;
  LOGIN_EMAIL=ev;
  if(/^admin/i.test(ev)){LOGIN_STEP='2fa';rerender();setTimeout(()=>{const c=document.getElementById('l_code');if(c)c.focus()},0);return}
  if(S.platform.maintenance){LOGIN_NOTE='Hệ thống đang bảo trì, vui lòng quay lại sau.';rerender();return}
  S.session={role:'customer',imp:null};LOGIN_NOTE='';save();go('/');toast('Đã đăng nhập');
}
function do2fa(){const v=document.getElementById('l_code').value.trim();if(!/^\d{6}$/.test(v)){document.getElementById('e_l_code').textContent='Mã gồm đúng 6 chữ số';return}
  S.session={role:'admin',imp:null};LOGIN_STEP='pw';LOGIN_NOTE='';audit('Đăng nhập, xác minh 2 lớp thành công','—','sec');save();go('/admin');toast('Đã đăng nhập khu quản trị')}

function savePlan(k){const p=S.plans[k];let ok=true;const v={};
  [['price',0,10000000],['products',1,1000000],['fbPerDay',1,500],['pages',0,100],['links',0,1000000],['members',1,100]].forEach(([id,lo,hi])=>{const raw=document.getElementById('pl_'+id).value.trim().replace(/\./g,''),n=Number(raw),er=document.getElementById('e_pl_'+id);er.textContent='';if(raw===''||!Number.isInteger(n)||n<lo||n>hi){er.textContent='Số nguyên từ '+n0(lo)+' đến '+n0(hi);ok=false}else v[id]=n});
  if(!ok)return;const ch=Object.keys(v).filter(x=>v[x]!==p[x]).map(x=>x);Object.assign(p,v,{show:document.getElementById('pl_show').checked});
  audit('Sửa gói '+p.name+(ch.length?' ('+ch.length+' giới hạn)':''),'Gói '+p.name);save();closeModal();rerender();toast('Đã lưu gói '+p.name)}

function savePlatform(){const pf=S.platform;let ok=true;
  const tr=document.getElementById('p_trial').value.trim(),se=document.getElementById('p_sess').value.trim(),bc=document.getElementById('p_bc').value.trim(),bcon=document.getElementById('p_bcon').checked;
  ['e_p_trial','e_p_sess','e_p_bc'].forEach(i=>document.getElementById(i).textContent='');
  if(!/^\d+$/.test(tr)||+tr<0||+tr>60){document.getElementById('e_p_trial').textContent='Từ 0 đến 60 ngày';ok=false}
  if(!/^\d+$/.test(se)||+se<1||+se>72){document.getElementById('e_p_sess').textContent='Từ 1 đến 72 giờ';ok=false}

  if(!ok)return;
  const was=JSON.stringify(pf);Object.assign(pf,{signup:document.getElementById('p_signup').checked,verifyEmail:document.getElementById('p_verify').checked,trialDays:+tr,bcOn:bcon,bc,maintenance:document.getElementById('p_maint').checked,require2fa:document.getElementById('p_2fa').checked,sessionHours:+se});
  if(was!==JSON.stringify(pf))audit('Sửa cài đặt nền tảng'+(pf.maintenance?', bật bảo trì':'')+(pf.bcOn?', bật thông báo chung':''),'Cài đặt nền tảng');

/* ---------- trang so sánh giá (người mua): dán link Shopee hoặc tìm tên → chọn nơi so sánh → kết quả ---------- */
let CMPQ='',CMPERR='',CMPT={tt:true,gg:true};
const isUrl=v=>/^https?:\/\/|^www\.|\.(vn|com)\//i.test(v);
const r1k=v=>Math.round(v/1000)*1000;
function cmpData(d){
  const srcK=d.offers.sp?'sp':'tt',otherK=srcK==='sp'?'tt':'sp',src=d.offers[srcK];
  const o=d.offers[otherK];
  const short=d.name.replace(/\s*\[.*\]\s*/,'').trim(),model=(d.name.match(/\[(.*)\]/)||[])[1]||'';
  const tt=o?[
    {conf:96,title:`${short} ${model} chính hãng`,shop:`[Shop ${PL[otherK]} 1]`,price:o.final,sold:'1,2k',note:'Trùng mã model và tên'},
    {conf:71,title:`${short} ${model.replace('Model','Model')} bản Lite`,shop:`[Shop ${PL[otherK]} 2]`,price:r1k(o.final*0.82),sold:'640',note:'Cùng hãng, khác phiên bản'}
  ]:[
    {conf:64,title:`${short} cùng phân khúc`,shop:`[Shop ${PL[otherK]} 3]`,price:r1k(src.final*0.9),sold:'310',note:'Chỉ giống tên, khác mã model'},
    {conf:58,title:`${short} loại phổ thông`,shop:`[Shop ${PL[otherK]} 4]`,price:r1k(src.final*0.7),sold:'2,1k',note:'Khác hãng'}
  ];
  const gg=[['Tiki','tiki.vn',1.04],['Lazada','lazada.vn',0.99],['CellphoneS','cellphones.com.vn',1.07],['Website hãng','[website hãng]',1.15]].map(([n,dom,k])=>({n,dom,price:r1k(src.final*k),title:`${short} ${model}`}));
  return {srcK,otherK,src,tt,gg,short,model};
}

      ${list}
      ${q?'':`<section><h2 style="font-size:16px;margin-bottom:10px">Đang được so sánh nhiều</h2><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px">${S.deals.filter(x=>x.offers.sp&&!x.flag).slice(0,4).map(x=>`<a href="#/site/${x.id}" class="card pad" style="text-decoration:none;color:var(--ink);display:flex;gap:10px;align-items:center">${thumb(x,40)}<span style="min-width:0"><b style="font-weight:500;display:block">${esc(x.name)}</b><span class="small muted">Shopee ${vnd(x.offers.sp.final)}</span></span></a>`).join('')}</div></section>`}
      <p class="small muted" style="margin:0">${esc(S.settings.disclosure)}</p></main>`;
  }
  /* bước 3: kết quả */
  const c=cmpData(d),src=c.src;

let CUR='/';try{CUR=location.hash.slice(1)||'/'}catch(e){}
function go(path){CUR=path||'/';dangerArm=null;try{history.replaceState(null,'','#'+CUR)}catch(e){}route();try{scrollTo(0,0)}catch(e){}}
function route(){
  let p=(CUR||'/').split('/').filter(Boolean);const r=p[0]||'';let html,mode;
  const redirect=to=>{CUR=to;p=to.split('/').filter(Boolean);try{history.replaceState(null,'','#'+to)}catch(e){}};
  if(r==='site'){mode='site';html=vSite(p[1])}
  else if(r==='login'){mode='login';html=vLogin()}
  else if(r==='admin'){
    if(S.session.role!=='admin'){LOGIN_NOTE='Trang này chỉ dành cho quản trị viên. Đăng nhập bằng tài khoản quản trị để tiếp tục.';LOGIN_STEP='pw';redirect('/login');mode='login';html=vLogin()}
    else{mode='admin';html=adminView(p)}}
  else{
    if(!S.session.role){LOGIN_NOTE='';redirect('/login');mode='login';html=vLogin()}
    else if(S.session.role==='admin'&&!S.session.imp){redirect('/admin');mode='admin';html=adminView(['admin'])}
    else{mode='customer';const v={review:vReview,matching:vMatching,performance:()=>vPerf(p[1]),sources:vSources,settings:()=>vSettings(p[1]),accounts:vAccounts,links:vLinks}[r];
      html=r==='schedule'?vSchedule(p[1]):v?v():vHome()}}
  const mb={customer:'m-admin',admin:'m-sa',login:'m-login',site:'m-site'};
  ['m-admin','m-sa','m-login','m-site'].forEach(id=>document.getElementById(id).classList.toggle('on',mb[mode]===id));
  document.getElementById('root').innerHTML=html;
  document.title=({site:'Trang so sánh giá',login:'Đăng nhập',admin:'Quản trị',customer:'Lienket Studio'})[mode]+' – Mockup';
}

let nextFb=['12:00','15:30','18:00','21:00','22:30'];
function approve(id){
  const d=D(id);if(!d||d.status!=='pending'||d.flag)return 0;
  const ch=S.chans[id]||{fbpage:true,fbgroup:true,tiktok:!!d.offers.tt};let n=0;
  if(ch.fbpage){const used=S.queue.filter(q=>q.ch==='fbpage').map(q=>q.time);const t=nextFb.find(x=>!used.includes(x))||'23:00';S.queue.push({id:S.nextId++,deal:id,ch:'fbpage',time:t,st:'scheduled'});n++}
  if(ch.fbgroup){S.queue.push({id:S.nextId++,deal:id,ch:'fbgroup',time:'—',st:'ready'});n++}
  if(ch.tiktok&&d.offers.tt){S.queue.push({id:S.nextId++,deal:id,ch:'tiktok',time:'—',st:'ready'});S.notifs.unshift({id:Date.now(),t:'vừa xong',x:'Gói video TikTok cho '+d.name+' đã sẵn sàng',read:false,go:'#/schedule/tiktok'});n++}
  d.status='approved';delete S.selected[id];return n;
}

  else if(ds.markpaid){const i=S.invoices.find(x=>x.no===ds.markpaid);i.st='paid';const c=CUS(i.cid);if(c.status==='overdue')c.status='active';audit('Xác nhận đã nhận tiền thủ công',i.no,'bill');save();rerender();toast('Đã ghi nhận thanh toán '+i.no);return}
  else if(ds.pdf){toast('Bản dùng thử: sẽ tải hóa đơn '+ds.pdf);return}
  else if(ds.tclose){S.tickets.find(x=>x.id===ds.tclose).st='closed';save();rerender();toast('Đã đánh dấu xong');return}
  else if(ds.topen){S.tickets.find(x=>x.id===ds.topen).st='open';save();rerender();return}
  else if(ds.reply){const el=document.getElementById('tr_msg'),v=el.value.trim();if(!v){document.getElementById('e_tr_msg').textContent='Viết nội dung trả lời';el.focus();return}
    const tk=S.tickets.find(x=>x.id===ds.reply);tk.msgs.push({who:'a',t:'vừa xong',x:v});if(tk.st==='open')tk.st='pending';save();rerender();toast('Đã gửi trả lời');return}
  else if('psave' in ds){savePlatform();return}
  else if('changeplan' in ds){changePlanModal();return}
  else if('confirmplan' in ds){const v=(document.querySelector('input[name=np]:checked')||{}).value,c=ME();if(!v||v===c.plan){closeModal();return}c.plan=v;save();closeModal();rerender();toast('Đã chuyển sang gói '+S.plans[v].name);return}
  else if('exportcus' in ds){toast('Bản dùng thử: sẽ tải danh sách khách hàng dạng CSV');return}
  else if('delws' in ds){toast('Bản dùng thử: sẽ yêu cầu nhập tên workspace để xác nhận xóa');return}
  else if(ds.acctconnect){openConnect(ds.acctconnect);return}
  else if(ds.acctoff){const k=ds.acctoff;if(dangerArm!=='off_'+k){dangerArm='off_'+k;rerender();setTimeout(()=>{if(dangerArm==='off_'+k){dangerArm=null;rerender()}},4000)}else{dangerArm=null;S.acct[k].on=false;if(k==='tiktok')S.conn.tiktokUpload=false;save();rerender();toast('Đã ngắt kết nối '+ACCT_NAME[k])}return}
  else if(ds.acctrenew){toast('Đang mở '+ACCT_NAME[ds.acctrenew]+' để cấp lại quyền…');setTimeout(()=>{if(ds.acctrenew==='meta'){S.acct.meta.exp=60;save();rerender()}toast('Đã làm mới quyền '+ACCT_NAME[ds.acctrenew])},900);return}
  else if('ttshopon' in ds){S.acct.ttshop.on=true;save();rerender();toast('Đã ghi nhận TikTok Shop Affiliate');return}
  else if(ds.delgroup){S.acct.meta.groups=S.acct.meta.groups.filter(g=>g.id!==ds.delgroup);save();rerender();toast('Đã gỡ Group');return}
  else if('addgroup' in ds){const el=document.getElementById('newGroup'),v=el.value.trim(),er=document.getElementById('e_newGroup');
    if(!/^https?:\/\/(www\.|m\.)?facebook\.com\/groups\/[\w.\-]+/i.test(v)){er.textContent='Dán link dạng https://facebook.com/groups/...';el.focus();return}
    const slug=v.replace(/\/+$/,'').split('/groups/')[1].split(/[/?#]/)[0];S.acct.meta.groups.push({id:'g'+Date.now(),name:'[Nhóm] '+slug,mem:'—'});save();rerender();toast('Đã thêm Group');return}
  else if('mclose' in ds){closeModal();return}
  else if(ds.mnext){connectStep(ds.mnext);return}
  else if(ds.theme){applyTheme(ds.theme);rerender();toast('Đã đổi màu chủ đạo: '+THEME_NAMES[ds.theme]);return}
  else if(ds.lf){LFILTER=ds.lf;rerender();return}
  else if(ds.copylink){copy('https://go.lienket.vn/'+ds.copylink,'Đã sao chép go.lienket.vn/'+ds.copylink);return}
  else if(ds.range){RANGE=+ds.range;const y=scrollY;route();scrollTo(0,y);return}
  else if('export' in ds){toast('Bản dùng thử: sẽ tải file báo cáo thu nhập')}
  else if('addniche' in ds){const el=document.getElementById('newNiche'),v=el.value.trim(),er=document.getElementById('e_newNiche');
    if(!v){er.textContent='Nhập tên ngách';el.focus()}else if(S.sys.general.niches.some(n=>n.n.toLowerCase()===v.toLowerCase())){er.textContent='Ngách này đã có'}
    else{S.sys.general.niches.push({n:v,on:false});save();rerender();toast('Đã thêm ngách "'+v+'", đang tắt')}}
  else if(ds.testkey){toast('Đang kiểm tra '+ds.testkey+'…');setTimeout(()=>toast(ds.testkey+': kết nối thành công'),800)}
  else if(ds.rotate){toast('Bản dùng thử: sẽ mở ô nhập khóa mới cho '+ds.rotate)}
  else if(ds.deluser){const u=S.sys.users.find(x=>x.id==ds.deluser);S.sys.users=S.sys.users.filter(x=>x.id!=ds.deluser);save();rerender();toast('Đã gỡ '+(u?u.name:'người dùng'))}
  else if('backup' in ds){toast('Đang sao lưu…');setTimeout(()=>toast('Sao lưu xong, đã đẩy lên Cloud Storage'),1000)}
  else if('logs' in ds){toast('Bản dùng thử: sẽ tải file nhật ký 7 ngày gần nhất')}
  else if('purge' in ds||'wipe' in ds){const k='purge' in ds?'purge':'wipe';
    if(dangerArm!==k){dangerArm=k;rerender();setTimeout(()=>{if(dangerArm===k){dangerArm=null;if(CUR==='/settings/system')rerender()}},4000)}
    else{dangerArm=null;if(k==='wipe'){S=initial();save();rerender();toast('Đã đặt lại dữ liệu mẫu')}else{rerender();toast('Đã dọn lịch sử giá chi tiết cũ')}}}
  if(!t.closest('.notif')){const p=document.getElementById('panel');if(p)p.classList.remove('open')}
  if(!t.closest('.memenu')){const p=document.getElementById('mepanel');if(p)p.classList.remove('open')}
});
document.addEventListener('change',e=>{
  const t=e.target,ds=t.dataset;
  if(ds.linkon){const l=S.links.find(x=>x.code===ds.linkon);l.on=t.checked;save();rerender();toast(t.checked?'Đã bật lại link '+l.code:'Đã tắt link '+l.code+', người bấm sẽ thấy trang báo link hết hạn');return}
  if(ds.pagepost){const pg=S.acct.meta.pages.find(x=>x.id===ds.pagepost);pg.post=t.checked;save();toast((t.checked?'Sẽ đăng tự động lên ':'Ngừng đăng lên ')+pg.name);return}
  if(ds.sel){S.selected[ds.sel]=t.checked;save();rerender()}

  else if('tiktokup' in ds){S.conn.tiktokUpload=t.checked;save();toast(t.checked?'Giả lập: đã có quyền video.upload':'Giả lập: chưa có quyền video.upload')}
});
const norm=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').toLowerCase();
document.addEventListener('input',e=>{if(e.target.id!=='q')return;const v=norm(e.target.value.trim()),box=document.getElementById('qres');
  if(!v){box.classList.remove('open');box.innerHTML='';return}
  const r=S.deals.filter(d=>norm(d.name).includes(v)).slice(0,6);
  box.innerHTML=r.length?r.map(d=>{const b=best(d);return `<a href="#/site/${d.id}" role="option">${thumb(d,32)}<span style="flex:1;min-width:0"><b>${esc(d.name)}</b><span class="small muted" style="display:block">${PL[b.k]} · ${vnd(b.final)}</span></span><span class="small" style="color:${drop(d)<0?'var(--accent-ink)':'var(--warn)'};font-weight:500">${drop(d)>0?'+':''}${drop(d)}%</span></a>`}).join(''):'<div class="small muted" style="padding:12px 14px">Không tìm thấy sản phẩm</div>';
  box.classList.add('open')});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='cmpq'){cmpSearch();return}if(e.key==='Escape'&&document.getElementById('modal').classList.contains('open')){closeModal();return}const q=document.getElementById('q');if(!q)return;
  if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){e.preventDefault();q.focus()}
  if(e.key==='Escape'){document.getElementById('qres').classList.remove('open');q.blur()}});
document.addEventListener('click',e=>{if(!e.target.closest('.search')){const b=document.getElementById('qres');if(b)b.classList.remove('open')}});
document.addEventListener('input',e=>{const l=e.target.closest('label');const er=l&&l.querySelector('.err');if(er)er.textContent=''});
/* nút Lưu xử lý trực tiếp: khung xem trước có thể chặn submit form */
document.addEventListener('click',e=>{const b=e.target.closest('button[type=submit]');if(!b)return;e.preventDefault();const f=b.closest('form');if(f)handleSubmit(f)},true);
document.addEventListener('submit',e=>{e.preventDefault();handleSubmit(e.target)});
function handleSubmit(form){
  const e={target:form};
  if(e.target.classList.contains('sysForm')){
    const f=e.target,g=f.dataset.group,obj=S.sys[g];let ok=true;const v={};
    f.querySelectorAll('[data-err]').forEach(x=>x.textContent='');
    f.querySelectorAll('input[name],select[name]').forEach(el=>{const k=el.name,err=f.querySelector(`[data-err="${k}"]`);
      if(k.startsWith('niche.')){v[k]=el.checked;return}
      if(el.type==='checkbox'){v[k]=el.checked;return}
      const raw=el.value.trim();
      if(el.dataset.min!==undefined){const n=Number(raw),lo=+el.dataset.min,hi=+el.dataset.max;if(raw===''||!Number.isInteger(n)||n<lo||n>hi){if(err)err.textContent='Nhập số nguyên từ '+lo+' đến '+hi;ok=false}else v[k]=n;return}
      if(el.type==='time'&&!/^\d{2}:\d{2}$/.test(raw)){if(err)err.textContent='Chọn giờ';ok=false;return}
      if(el.type==='text'&&!raw){if(err)err.textContent='Không được để trống';ok=false;return}
      v[k]=raw});
    if(!ok){const first=f.querySelector('.err:not(:empty)');if(first)first.closest('label').querySelector('input,select').focus();return}
    Object.keys(v).forEach(k=>{if(k.startsWith('niche.'))obj.niches[+k.slice(6)].on=v[k];else obj[k]=v[k]});
    save();rerender();toast(g==='system'&&v.paused?'Đã lưu · đang tạm dừng đăng bài':'Đã lưu cài đặt');return;
  }
  if(e.target.id==='userForm'){
    const n=document.getElementById('u_name'),m=document.getElementById('u_email'),r=document.getElementById('u_role');let ok=true;
    document.getElementById('e_u_name').textContent='';document.getElementById('e_u_email').textContent='';
    if(!n.value.trim()){document.getElementById('e_u_name').textContent='Nhập tên';ok=false}
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(m.value.trim())){document.getElementById('e_u_email').textContent='Email chưa đúng định dạng';ok=false}
    else if(S.sys.users.some(u=>u.email.toLowerCase()===m.value.trim().toLowerCase())){document.getElementById('e_u_email').textContent='Email này đã được mời';ok=false}
    if(!ok)return;
    S.sys.users.push({id:Date.now(),name:n.value.trim(),email:m.value.trim(),role:r.value});save();rerender();toast('Đã gửi lời mời tới '+m.value.trim());return;
  }
  if(e.target.id!=='setForm')return;
  const f=[['minDrop',1,90],['minScore',0,100],['fakeRise',1,200],['minComm',0,50],['capFb',1,50],['capGroup',0,30]];let ok=true;const v={};
  f.forEach(([k,lo,hi])=>{const el=document.getElementById('s_'+k),raw=el.value.trim(),n=Number(raw);if(raw===''||!Number.isFinite(n)||n<lo||n>hi){document.getElementById('e_'+k).textContent='Nhập số từ '+lo+' đến '+hi;ok=false}else v[k]=n});
  const disc=document.getElementById('s_disclosure').value.trim();if(!disc){document.getElementById('e_disclosure').textContent='Câu ghi chú là bắt buộc';ok=false}
  if(!ok)return;Object.assign(S.settings,v,{disclosure:disc});['verify','manual','aiNoClaims'].forEach(k=>S.settings[k]=document.getElementById('s_'+k).checked);save();toast('Đã lưu cài đặt');
}
document.getElementById('reset').addEventListener('click',()=>{S=initial();save();route();toast('Đã đặt lại dữ liệu mẫu')});
const THEMES={
  grayorange:['#D9621F','#A84A15','#FCEBDF','#FEF6F0','#F2C4A6'],
  violet:['#5B45D6','#4632B0','#EEEBFC','#F7F5FE','#CFC7F3'],
  navy:['#1E3A8A','#1E3A8A','#E6ECF8','#F4F7FC','#BFCBE6'],
  crimson:['#B4233C','#931B30','#FBE9EC','#FDF5F6','#EDBCC5'],
  amber:['#A15C07','#7C4505','#FBF0DF','#FDF8EF','#EBCB98'],
  graphite:['#2F3640','#1F242B','#E9EBEE','#F5F6F7','#C3C8CF']
};
function applyTheme(k){CURTHEME=THEMES[k]?k:'grayorange';const t=THEMES[k]||THEMES.grayorange,r=document.documentElement.style;['--accent','--accent-ink','--accent-bg','--accent-row','--accent-soft'].forEach((v,i)=>r.setProperty(v,t[i]));try{localStorage.setItem(KEY+'-theme-v2',k)}catch(e){}}
let savedTheme='grayorange';try{savedTheme=localStorage.getItem(KEY+'-theme-v2')||'grayorange'}catch(e){}
if(!THEMES[savedTheme])savedTheme='grayorange';CURTHEME=savedTheme;applyTheme(savedTheme);
document.addEventListener('click',e=>{if(e.target.classList&&e.target.classList.contains('mback'))closeModal()});
document.addEventListener('click',e=>{if(!e.target.closest('.memenu')){const p=document.getElementById('mepanel');if(p)p.classList.remove('open')}
  const tr=e.target.closest('tr.click');if(tr&&!e.target.closest('a,button,input')){go(tr.dataset.href.slice(1))}});
document.addEventListener('input',e=>{if(e.target.id!=='acq')return;ACQ=e.target.value;const q=norm(ACQ.trim());let n=0;
  document.querySelectorAll('#custTable tbody tr[data-s]').forEach(tr=>{const ok=!q||tr.dataset.s.includes(q);tr.style.display=ok?'':'none';if(ok)n++});
  const em=document.getElementById('custEmpty');if(em)em.style.display=n?'none':'block'});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='acq_top'){ACQ=e.target.value;ACF='all';go('/admin/customers');setTimeout(()=>{const a=document.getElementById('acq');if(a){a.dispatchEvent(new Event('input',{bubbles:true}))}},0)}
  if(e.key==='Enter'&&(e.target.id==='l_email'||e.target.id==='l_pw'))doLogin();
  if(e.key==='Enter'&&e.target.id==='l_code')do2fa();
  if(e.key==='Escape'){const p=document.getElementById('mepanel');if(p)p.classList.remove('open')}});
/* tooltip cho biểu đồ */
function tipAt(el,x,y){const t=document.getElementById('tip');t.firstChild.textContent=el.dataset.tip;t.lastChild.textContent=el.dataset.tipl||'';t.classList.add('show');
  const r=t.getBoundingClientRect();let L=x+14,T=y-r.height-12;if(L+r.width>innerWidth-8)L=x-r.width-14;if(T<8)T=y+16;t.style.left=L+'px';t.style.top=T+'px';
  const svg=el.closest('svg');if(svg&&el.dataset.cx){const xh=svg.querySelector('.xh'),xm=svg.querySelector('.xm');xh.setAttribute('x1',el.dataset.cx);xh.setAttribute('x2',el.dataset.cx);xh.setAttribute('opacity','1');xm.setAttribute('cx',el.dataset.cx);xm.setAttribute('cy',el.dataset.cy);xm.setAttribute('opacity','1');const xm2=svg.querySelector('.xm2');if(xm2&&el.dataset.cy2){xm2.setAttribute('cx',el.dataset.cx);xm2.setAttribute('cy',el.dataset.cy2);xm2.setAttribute('opacity','1')}}}
function tipHide(){const t=document.getElementById('tip');t.classList.remove('show');document.querySelectorAll('.xh,.xm,.xm2').forEach(e=>e.setAttribute('opacity','0'))}
document.addEventListener('pointermove',e=>{const el=e.target.closest&&e.target.closest('[data-tip]');if(el)tipAt(el,e.clientX,e.clientY);else tipHide()});
document.addEventListener('pointerleave',tipHide);
document.addEventListener('scroll',tipHide,{passive:true});
route();
})();
</script>
