# Nginx reverse proxy + cache tầng origin (đặt trước Next.js, sau CDN).
# Giúp Node chỉ render 1 lần, các request sau lấy từ cache đĩa của nginx.

proxy_cache_path /var/cache/nginx/next levels=1:2 keys_zone=next_cache:50m
                 max_size=2g inactive=7d use_temp_path=off;

upstream nextjs {
    server 127.0.0.1:3000;
    keepalive 64;
}

server {
    listen 80;
    server_name lienketstudio.com www.lienketstudio.com;
    return 301 https://lienketstudio.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name lienketstudio.com;

    # ssl_certificate     /etc/letsencrypt/live/lienketstudio.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/lienketstudio.com/privkey.pem;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml text/x-component;
    gzip_min_length 1024;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Static có hash: cache vĩnh viễn
    location /_next/static/ {
        proxy_pass http://nextjs;
        proxy_cache next_cache;
        proxy_cache_valid 200 365d;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # Ảnh đã tối ưu: phải giữ header Accept trong cache key (avif/webp)
    location /_next/image {
        proxy_pass http://nextjs;
        proxy_cache next_cache;
        proxy_cache_key "$scheme$host$request_uri$http_accept";
        proxy_cache_valid 200 30d;
        add_header X-Cache-Status $upstream_cache_status;
    }

    location /api/ {
        proxy_pass http://nextjs;
        proxy_cache off;
    }

    location / {
        proxy_pass http://nextjs;
        proxy_cache next_cache;
        # Cache key PHẢI gồm query string (?_rsc=...) và header rsc để không trộn HTML với RSC payload
        proxy_cache_key "$scheme$host$request_uri|rsc=$http_rsc|pf=$http_next_router_prefetch";
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        # Tôn trọng Cache-Control của Next.js (s-maxage); trang dynamic (private/no-store) tự bỏ qua cache
        add_header X-Cache-Status $upstream_cache_status;
        # Lưu ý: KHÔNG đặt proxy_buffering off ở đây – nginx cần buffering để cache.
        # Route nào cần streaming thật (dynamic + Suspense) thì tách location riêng với proxy_buffering off.
    }
}
